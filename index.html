<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Подбор метода управления освещением Maytoni по объекту, источникам света и задачам проекта.">
<meta name="theme-color" content="#5B34E0">
<title>Конфигуратор управления освещением Maytoni</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235B34E0'/%3E%3Cpath d='M9 22V10l7 8 7-8v12' fill='none' stroke='white' stroke-width='2.6' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{
  --ink:#17151C; --muted:#5B5766; --soft:#3D3946; --line:#E3E0EA; --line2:#CFCAD9; --bg:#F6F5F9; --white:#FFFFFF;
  --accent:#5B34E0; --accent-d:#43229F; --accent-bg:#F3EFFF; --accent-chip:#E9E3FF;
  --ok-bg:#DDF3E6; --ok:#11512F; --fit-bg:#E3ECFF; --fit:#1C3F94; --warn-bg:#FFF1D6; --warn:#6B4200; --maybe-bg:#F0EEF4;
  --r:16px;
}
*{box-sizing:border-box}
html{scroll-padding-top:20px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Golos Text','Segoe UI',system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:var(--white);padding:10px 14px;border-radius:10px;z-index:10}
.skip:focus{left:8px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* header & steps */
.top{background:var(--white);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:16px;padding-bottom:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand img{height:34px;width:auto;display:block;mix-blend-mode:multiply}
.brand span{font-size:16px;color:var(--muted)}
.steps{background:var(--white);border-bottom:1px solid var(--line)}
.steps .wrap{display:flex;gap:6px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.step{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;border:0;background:transparent;font-size:15px;color:var(--muted);min-height:44px}
.step i{font-style:normal;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.step.done i{background:var(--accent-chip);border-color:var(--accent-chip);color:var(--accent-d)}
.step.cur{background:var(--ink);color:var(--white);font-weight:600}
.step.cur i{background:var(--white);border-color:var(--white);color:var(--ink)}
.step:disabled{cursor:default;opacity:.55}

/* page */
main{padding:40px 0 150px}
main .wrap{display:flex;flex-direction:column;gap:28px}
.intro{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:15px;font-weight:600;color:var(--accent)}
h1{margin:0;font-size:clamp(30px,4vw,40px);line-height:1.15;font-weight:800;letter-spacing:-.01em}
h2{margin:0;font-size:26px;line-height:1.2;font-weight:800}
h3{margin:0;font-size:20px;line-height:1.3;font-weight:700}
.lead{margin:0;font-size:19px;color:var(--muted);max-width:780px}
.muted{color:var(--muted)}
.small{font-size:15px}
.card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:30px;display:flex;flex-direction:column;gap:28px}
.q{display:flex;flex-direction:column;gap:12px}
.q-title{font-size:20px;font-weight:700}
.q-hint{font-size:15px;color:var(--muted);margin-top:-6px}

/* choices */
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.choices.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.opt{min-height:56px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--white);text-align:left;display:flex;gap:12px;align-items:flex-start}
.opt:hover{border-color:var(--line2)}
.opt .mark{flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;border:2px solid #B9B2C8;display:flex;align-items:center;justify-content:center}
.opt.multi .mark{border-radius:6px}
.opt .mark b{width:10px;height:10px;border-radius:50%;background:transparent}
.opt.multi .mark b{border-radius:2px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg)}
.opt[aria-pressed="true"] .mark{border-color:var(--accent)}
.opt[aria-pressed="true"] .mark b{background:var(--accent)}
.opt .t{display:flex;flex-direction:column;gap:2px}
.opt .t strong{font-weight:600}
.opt .t small{font-size:15px;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.cat{min-height:140px;padding:22px;border-radius:16px;border:2px solid var(--line);background:var(--white);text-align:left;display:flex;flex-direction:column;gap:10px}
.cat:hover{border-color:var(--line2)}
.cat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg)}
.cat strong{font-size:20px}
.cat small{font-size:15px;color:var(--muted)}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{min-height:48px;padding:0 20px;border-radius:999px;border:2px solid var(--line2);background:var(--white);font-size:16px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--white)}
.chip:disabled{background:var(--bg);border-color:#ECEAF0;color:#A19BAD;cursor:not-allowed}

/* inputs */
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;align-items:end}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:16px;font-weight:600}
.input{min-height:52px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line2);background:var(--white);font-size:17px;width:100%}
.input:focus{border-color:var(--accent)}

/* notices */
.note{display:flex;gap:12px;padding:16px 18px;border-radius:14px;font-size:16px}
.note svg{flex:none;margin-top:2px}
.note.warn{background:var(--warn-bg);color:#5A3B00}
.note.info{background:var(--bg);color:var(--soft)}
.note.accent{background:var(--accent-bg);color:var(--accent-d)}
details.help{background:var(--bg);border-radius:14px;padding:14px 18px}
details.help summary{cursor:pointer;font-weight:600;color:var(--accent-d)}
details.help p{margin:10px 0 0;font-size:16px;color:var(--soft)}

/* rooms & sources */
.rooms{display:flex;gap:10px;flex-wrap:wrap}
.room{min-height:58px;padding:8px 20px;border-radius:14px;border:1px solid var(--line);background:var(--white);text-align:left;display:flex;flex-direction:column;justify-content:center}
.room strong{font-weight:600}
.room small{font-size:14px;color:var(--muted)}
.room[aria-pressed="true"]{border:2px solid var(--ink)}
.dashed{min-height:58px;padding:8px 20px;border-radius:14px;border:1.5px dashed #B9B2C8;background:transparent;font-weight:600;color:var(--accent-d);display:flex;align-items:center;justify-content:center;gap:8px}
.src-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.src-id{display:flex;align-items:center;gap:14px}
.num{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--white);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.num.light{background:#F0EEF4;color:var(--soft)}
.row{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.row .grow{flex:1 1 280px;display:flex;flex-direction:column}
.row .grow strong{font-size:18px}
.btn{min-height:48px;padding:0 20px;border-radius:12px;border:1.5px solid var(--line2);background:var(--white);font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--white)}
.btn.primary:hover{background:var(--accent-d);border-color:var(--accent-d)}
.btn.outline{border-color:var(--accent);color:var(--accent-d)}
.btn.lg{min-height:52px;padding:0 26px;font-size:17px;border-radius:14px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--white);color:var(--muted);display:flex;align-items:center;justify-content:center}
.text-btn{border:0;background:none;color:var(--accent-d);font-weight:600;min-height:44px;padding:0 4px}

/* results */
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{padding:7px 14px;border-radius:999px;background:var(--white);border:1px solid var(--line);font-size:15px}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-size:15px;font-weight:700}
.badge.recommended{background:var(--ok-bg);color:var(--ok)}
.badge.fits{background:var(--fit-bg);color:var(--fit)}
.badge.caveats{background:var(--warn-bg);color:var(--warn)}
.badge.maybe-card{background:var(--maybe-bg);color:var(--soft)}
.option{background:var(--white);border:2px solid var(--line);border-radius:20px;padding:30px;display:flex;flex-direction:column;gap:22px}
.option.sel{border-color:var(--ink)}
.option-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.option-head .t{display:flex;flex-direction:column;gap:12px;max-width:720px}
.option-head p{margin:0;color:var(--soft)}
.breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.broom{background:var(--bg);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.broom h3{font-size:18px}
.bz{display:flex;justify-content:space-between;gap:12px;padding-top:10px;border-top:1px solid var(--line)}
.bz:first-of-type{border-top:0;padding-top:0}
.bz .n{display:flex;flex-direction:column}
.bz .n span{font-weight:600}
.bz .n small{font-size:15px;color:var(--muted)}
.mchip{align-self:flex-start;padding:4px 12px;border-radius:8px;background:var(--white);border:1px solid var(--line);font-size:15px;font-weight:700;white-space:nowrap}
.pc{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px 28px;margin:0;padding:0;list-style:none}
.pc li{display:flex;gap:10px;align-items:flex-start}
.pc svg{flex:none;margin-top:3px}
.list{margin:6px 0 0;padding-left:20px}
.list li{margin:2px 0}
.maybes{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.maybe-card{background:var(--white);border:1.5px dashed #B9B2C8;border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:14px}
.maybe-card .chg{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:14px;background:var(--accent-bg);color:var(--accent-d)}
.maybe-card .chg strong{font-size:15px}
details.why{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:22px 28px}
details.why summary{cursor:pointer;font-size:19px;font-weight:700}
.why-row{display:grid;grid-template-columns:minmax(130px,200px) minmax(0,1fr);gap:16px;padding:12px 0;border-top:1px solid #ECEAF0}
.why-row:first-child{margin-top:12px}
.legend{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;font-size:15px;color:var(--muted)}

/* equipment */
.eq-room{display:flex;flex-direction:column;gap:14px}
.zone{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px}
.zone-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.item{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid #ECEAF0}
.item:first-child{border-top:0;padding-top:0}
.item-title{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-weight:600}
.qty{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--ink);color:var(--white)}
.skus{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:15px;color:var(--muted)}
.sku{font-weight:700;color:var(--accent-d);background:var(--accent-bg);padding:3px 10px;border-radius:8px;font-size:15px}
.type-only{font-size:15px;color:var(--muted)}
.item .pend{font-size:15px;color:#7A4B00}
.item .iss{font-size:15px;color:#8A2A12;font-weight:600}
.variant{border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.variant h4{margin:0 0 6px;font-size:16px}
.card.export{flex-direction:row;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}

/* expert mode */
.modebar{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:10px 18px;border-radius:14px;background:var(--white);border:1px solid var(--line);font-size:16px}
.modebar .text-btn{min-height:36px}
.block-card{background:#FDECEA;border:2px solid #C4452B;border-radius:20px;padding:28px 30px;display:flex;flex-direction:column;gap:16px;color:#5C1A0B}
.block-card h2{color:#5C1A0B}
.block-card .acts{display:flex;gap:10px;flex-wrap:wrap;padding-left:40px}
.block-card .btn:not(.primary){border-color:#C4452B;color:#5C1A0B}
.crow{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid #ECEAF0;flex-wrap:wrap}
.zone .crow:first-of-type,.zone h3+.crow{border-top:0}
.crow>span:first-child{flex:none;margin-top:2px}
.crow .grow{flex:1 1 300px;display:flex;flex-direction:column}
.decide{border:2px solid #E8A33D;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;margin:8px 0}

/* footer */
.btn.primary.soft-off{background:#D8D3E3;border-color:#D8D3E3;color:#6E6880}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--line);z-index:5}
.foot .bar{height:3px;background:var(--accent);transition:width .3s}
.foot .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));flex-wrap:wrap}
.foot .acts{display:flex;gap:10px;margin-left:auto}
.modal{position:fixed;inset:0;background:rgba(23,21,28,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}
.modal[hidden],.toast[hidden]{display:none}
.modal-box{background:var(--white);border-radius:20px;padding:28px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(23,21,28,.25)}
.modal-box p{margin:0}
.modal-acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.toast-btn{margin-left:12px;border:0;background:var(--white);color:var(--ink);font-weight:700;border-radius:8px;padding:6px 12px;min-height:36px}
.toast{display:flex;align-items:center;position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--white);padding:12px 20px;border-radius:12px;font-size:16px;z-index:20;max-width:90vw}
@media (max-width:640px){
  .card,.option{padding:20px}
  main{padding-top:28px}
  .foot .muted{display:none}
  .why-row{grid-template-columns:1fr;gap:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* protocol colors */
.pm-DALI,.pc-DALI{--pc:#0E7490;--pbg:#DDF1F6;--pt:#0E5566;--psoft:#F2FAFC}
.pm-ZIGBEE,.pc-ZIGBEE{--pc:#C2410C;--pbg:#FFEAD5;--pt:#7C2D12;--psoft:#FFF7EF}
.pm-WIFI,.pc-WIFI{--pc:#1D4ED8;--pbg:#E0E9FF;--pt:#1E3A8A;--psoft:#F3F6FF}
.pm-TRIAC,.pc-TRIAC{--pc:#BE185D;--pbg:#FCE7F3;--pt:#831843;--psoft:#FDF3F8}
.pm-RF,.pc-RF{--pc:#15803D;--pbg:#DCF5E3;--pt:#14532D;--psoft:#F1FAF3}
.pm-SPI,.pc-SPI{--pc:#374151;--pbg:#E5E7EB;--pt:#1F2937;--psoft:#F5F6F8}
.pm-SWITCH,.pc-SWITCH{--pc:#6B6578;--pbg:#F0EEF4;--pt:#3D3946;--psoft:#F7F6FA}
.pm{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:8px;background:var(--pbg);color:var(--pt);font-size:15px;font-weight:700;white-space:nowrap;align-self:flex-start;vertical-align:middle}
.pm i{width:8px;height:8px;border-radius:50%;background:var(--pc);flex:none}
.pm.big{font-size:20px;padding:6px 14px;border-radius:10px;gap:10px}
.pm.big i{width:11px;height:11px}
.pplus{font-size:20px;font-weight:800;color:#A19BAD;margin:0 8px;vertical-align:middle}
.ptitle{display:flex;align-items:center;flex-wrap:wrap;gap:8px 0;line-height:1.6}
.maybe-card h3 .pm{font-size:20px}

/* kind icons */
.kopt{align-items:center}
.kicon{flex:none;width:56px;height:56px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--ink);font-family:inherit}
.kopt[aria-pressed="true"] .kicon{background:var(--white)}
.kicon text{font-family:'Golos Text',system-ui,sans-serif}

/* motion toggle */
.toggle{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px 20px;max-width:640px}
.toggle .sw{flex:none;width:46px;height:28px;border-radius:999px;background:#CFCAD9;position:relative;transition:background .2s;margin-top:2px}
.toggle .sw b{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle[aria-checked="true"] .sw{background:var(--accent)}
.toggle[aria-checked="true"] .sw b{transform:translateX(18px)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:40px;font-weight:800;line-height:1.1}
.stat span{color:var(--muted)}
.stat.dark{background:var(--ink);border-color:var(--ink);gap:10px;justify-content:space-between}
.stat.dark>span{color:#CFCAD9}

/* schematic */
.schema{gap:20px}
.schema-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.snodes{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:0}
.node{border:2px solid var(--pc,#0E7490);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;min-width:220px;background:var(--white)}
.snodes .node{--pc:inherit}
.node small{font-size:13px;font-weight:700;color:var(--muted)}
.node .nsku{font-size:14px;font-weight:700;color:var(--accent-d)}
.node.solid{color:#fff}
.slink{width:36px;height:4px;background:var(--pc)}
.sdrop{width:4px;height:24px;background:var(--pc);margin:0 auto}
.sbus{display:flex;align-items:center;gap:12px}
.sbus i{flex:1;height:4px;border-radius:2px;background:var(--pc)}
.sbus span{flex:none;padding:4px 12px;border-radius:999px;background:var(--pbg);color:var(--pt);font-size:14px;font-weight:700}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.scol{display:flex;flex-direction:column;align-items:center}
.stem{width:4px;height:20px;background:var(--pc)}
.stem.dash{width:0;background:none;border-left:3px dashed var(--pc)}
.stem.none{display:none}
.sroom{width:100%;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--white)}
.sroom.off{border:1.5px dashed var(--pc)}
.sroom-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.sroom-h strong{font-size:17px}
.sroom-h small{font-size:13px;font-weight:700;color:var(--pt,var(--muted))}
.srow{display:flex;flex-direction:column;padding:8px 12px;border-radius:12px;background:var(--psoft);border-left:4px solid var(--pc);font-size:15px}

.srow.plain{background:var(--bg);border-left:0}

.snodes:has(+ .sdrop.pc-DALI) .node{--pc:#0E7490}

.node.solid small{color:#CFCAD9}

/* Maytoni system line */
.sys{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--bg)}
.sys-mark{flex:none;width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}

/* DALI address meter */
.dali-card{gap:16px}
.meter{height:12px;border-radius:999px;background:var(--bg);overflow:hidden}
.meter div{height:100%;background:#0E7490;border-radius:999px;transition:width .3s}
.meter.over div{background:#C4452B}
.meter-text{display:flex;flex-direction:column;gap:2px}
.meter-text strong{font-size:22px}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

#page.anim>*:nth-child(2){animation-delay:.04s}#page.anim>*:nth-child(3){animation-delay:.08s}#page.anim>*:nth-child(4){animation-delay:.12s}#page.anim>*:nth-child(n+5){animation-delay:.16s}

  /* ---------- Подбор оборудования ---------- */
  const plural = (n, one, few, many) => n % 10 === 1 && n % 100 !== 11 ? one : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? few : many;

      return `<section class="card">${q('Есть ли на объекте стабильный интернет?', choice('internet', OPT.internet), pr === 'ZIGBEE' ? 'ZigBee нужен интернет для настройки и удалённого доступа.' : 'Wi-Fi-устройства работают через интернет постоянно.')}${blk ? '' : q('Где будет работать освещение?', choice('object', OPT.object), 'Необязательно — попадёт в итоговый файл.')}</section>${blk ? blockCard(blk) : ''}`;
    }
    const showBus = state.object !== 'room' && state.budget !== 'low';
    return `<section class="card">
      ${q('Где будет работать освещение?', choice('object', OPT.object))}
      ${q('Бюджет на управление светом', choice('budget', OPT.budget), 'При минимальном бюджете проводная система DALI не предлагается.')}
      ${q('На какой стадии ремонт?', choice('stage', OPT.stage))}
      ${showBus ? q('Есть ли линия управления DALI?', choice('bus', busOptions(), { wide: true }), 'DALI нужна отдельная линия управления (шина). Если не знаете, что это, — выбирайте «Пока не знаю».') : ''}
      ${q('Есть ли на объекте стабильный интернет?', choice('internet', OPT.internet), 'Без интернета не предлагаем Wi-Fi и ZigBee: их настройка идёт через облако.')}
    </section>`;
  }

  /* ---------- step 2: sources ---------- */
  function sourceCard(s, i) {
    const k = s.kind ? E.KINDS[s.kind] : null;
    const allowed = k ? k.feats : [];
    const onlySpi = state.sources.every(x => x.kind === 'strip_spi');
    return `<section class="card" aria-label="Источник ${i + 1}">
      <div class="src-head"><div class="src-id"><span class="num">${String(i + 1).padStart(2, '0')}</span><div><h3>${esc(srcTitle(s))}</h3><span class="muted small">${esc(roomName(s.roomId))}</span></div></div>
      <div style="display:flex;gap:8px"><button type="button" class="btn" data-action="close-src" data-src="${s.id}">Свернуть</button><button type="button" class="icon-btn" data-action="delete-src" data-src="${s.id}" aria-label="Удалить источник">${IC.trash()}</button></div></div>
      ${q('Что это?', `<div class="cats">${Object.entries(CATS).map(([c, d]) => `<button type="button" class="cat" aria-pressed="${s.cat === c}" data-action="set-cat" data-cat="${c}" data-src="${s.id}">${IC[c]()}<strong>${d.label}</strong><small>${d.hint}</small></button>`).join('')}</div>`)}
      ${s.cat === 'strip' ? q('Как выбрать ленту?', `<div class="chips"><button type="button" class="chip" aria-pressed="${s.stripMode !== 'sku'}" data-action="strip-mode" data-mode="params" data-src="${s.id}">По параметрам</button><button type="button" class="chip" aria-pressed="${s.stripMode === 'sku'}" data-action="strip-mode" data-mode="sku" data-src="${s.id}">По артикулу Maytoni</button></div>`) : ''}
      ${s.cat === 'strip' && s.stripMode === 'sku' ? stripSkuBlock(s) : ''}
      ${s.cat && !(s.cat === 'strip' && s.stripMode === 'sku') ? q(CATS[s.cat].title, `<div class="choices wide">${CATS[s.cat].kinds.filter(kindAllowed).map(kd => `<button type="button" class="opt kopt" aria-pressed="${s.kind === kd}" data-action="set-kind" data-kind="${kd}" data-src="${s.id}">${kindIcon(kd)}<span class="t"><strong>${KIND_UI[kd][0]}</strong><small>${KIND_UI[kd][1]}</small></span></button>`).join('')}</div>
        ${expert() && state.proto === 'RF' && s.cat !== 'strip' ? note('Для RF ШИМ доступны только источники 12–24 В.') : ''}
        ${s.cat === 'lum' ? `<details class="help"><summary>Как понять, можно ли заменить драйвер?</summary><p>Если драйвер — отдельный блок, который можно снять, его можно заменить на управляемый. Он может быть на проводе рядом со светильником (так у большинства спотов) или внутри потолочной чаши (у люстр и подвесов). Если драйвер встроен в корпус без возможности доступа — так обычно у бра и настольных ламп, — заменить его нельзя.</p></details>` : ''}`) : ''}
      ${k ? q('Что нужно менять?', `<div class="chips">${FEAT.filter(([f]) => f !== 'fx' || allowed.includes('fx')).map(([f, l]) => { const ok = allowed.includes(f); return `<button type="button" class="chip" aria-pressed="${ok && s.features.includes(f)}" ${ok ? '' : 'disabled'} data-action="toggle-feat" data-feat="${f}" data-src="${s.id}">${l}</button>`; }).join('')}</div>
        ${s.kind === 'led_fixed' ? note('Драйвер встроен в корпус, поэтому такой светильник можно только включать и выключать. Для регулировки яркости нужен светильник с заменяемым драйвером.', 'warn') : ''}
        ${s.kind === 'strip_spi' ? note('Динамическая лента всегда управляется отдельным SPI-контроллером, рядом с основным светом.') : ''}`, 'Можно выбрать несколько') : ''}
      ${k && expert() && s.kind !== 'strip_spi' && !E.capability(state.proto, s).ok ? note(esc(E.TITLES[state.proto]) + ' этот источник не покрывает — на шаге проверки предложим решение.', 'warn') : ''}
      ${s.kind === 'strip_spi' && onlySpi ? q('Как управлять динамической лентой?', choice('spiControl', OPT.spiControl, { src: s })) : ''}
      ${k ? `<div class="field" style="max-width:480px"><label for="${s.id}-name">Название или зона <span class="muted" style="font-weight:400">— необязательно</span></label><input class="input" id="${s.id}-name" type="text" maxlength="60" data-src="${s.id}" data-field="name" value="${esc(s.name)}" placeholder="Например, подвесы над столом"></div>` : ''}
    </section>`;
  }
  function stripSkuBlock(s) {
    if (s.stripSku && E.STRIPS[s.stripSku]) {
      const st = E.STRIPS[s.stripSku];
      return `<div class="note accent" style="align-items:center;flex-wrap:wrap"><span class="sku">${esc(st.sku)}</span><div style="flex:1 1 240px"><strong>${esc(KIND_UI[st.kind][0])}</strong><br><span class="small">${esc(st.name)}</span></div><button type="button" class="btn" data-action="strip-clear" data-src="${s.id}">Сменить артикул</button></div>`;
    }
    return `<div class="field" style="max-width:560px"><label for="${s.id}-sq">Артикул ленты</label><input class="input" id="${s.id}-sq" type="text" inputmode="numeric" autocomplete="off" list="strip-list" data-src="${s.id}" data-field="stripQuery" value="${esc(s.stripQuery)}" placeholder="Например, 201124"><div data-stripmsg="${s.id}">${stripMsg(s.stripQuery)}</div></div>`;
  }
  function stripMsg(qv) {
    const v = String(qv || '').trim().split(/\s/)[0];
    const s220 = E.STRIPS_220[v] || E.STRIPS_220[v.padStart(6, '0')];
    if (s220) return note(`<strong>${esc(s220.sku)} — лента 220 В.</strong> Такие ленты предназначены для улицы: они работают с пульсацией и для помещений не рекомендуются. Ими можно только включать и выключать свет, поэтому управление для них конфигуратор не подбирает. Для помещения выберите ленту 12–48 В.`, 'warn');
    if (v.length >= 6) return note('Такого артикула нет в прайсе лент. Проверьте номер или выберите ленту по параметрам.', 'warn');
    return '<span class="muted small">Начните вводить — появятся подсказки. Тип, напряжение и мощность подставятся сами.</span>';
  }
  function applyStrip(s, sku) {
    const st = E.STRIPS[sku]; if (!st) return false;
    const allow = E.KINDS[st.kind].feats;
    Object.assign(s, { stripSku: sku, stripQuery: sku, kind: st.kind, voltage: String(st.v), wpm: String(st.w), wet: st.ip >= 65 ? 'yes' : (s.wet || 'no'), features: s.features.filter(f => allow.includes(f)) });

  }
  function sourceRow(s, i) {

      <button type="button" class="btn" data-action="open-src" data-src="${s.id}">Изменить</button><button type="button" class="icon-btn" data-action="delete-src" data-src="${s.id}" aria-label="Удалить ${esc(srcTitle(s))}">${IC.trash()}</button></div>`;
  }
  function pageSources() {
    const room = state.rooms.find(r => r.id === state.activeRoom) || state.rooms[0];
    const list = state.sources.filter(s => s.roomId === room.id);
    const count = id => state.sources.filter(s => s.roomId === id).length;
    const word = n => n % 10 === 1 && n % 100 !== 11 ? 'источник' : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? 'источника' : 'источников';
    return `<div class="rooms" aria-label="Помещения">${state.rooms.map(r => `<button type="button" class="room" aria-pressed="${r.id === room.id}" data-action="select-room" data-room="${r.id}"><strong>${esc(r.name)}</strong><small>${count(r.id)} ${word(count(r.id))}</small></button>`).join('')}
      <button type="button" class="dashed" data-action="add-room">${IC.plus()}Добавить помещение</button></div>
      <div class="field" style="max-width:480px"><label for="room-name">Название помещения</label><div style="display:flex;gap:10px"><input class="input" id="room-name" maxlength="60" data-room-name="${room.id}" value="${esc(room.name)}" placeholder="Например, гостиная">${state.rooms.length > 1 ? `<button type="button" class="btn" data-action="delete-room" data-room="${room.id}">Удалить</button>` : ''}</div></div>
      ${!localProto() ? `<button type="button" class="toggle" role="switch" aria-checked="${!!room.motion}" data-action="toggle-motion" data-room="${room.id}"><span class="sw"><b></b></span><span><strong>Включать свет по движению</strong><br><span class="muted small">Например, в коридоре, санузле, гардеробной. Подберём датчик движения.</span></span></button>` : ''}
      <div style="display:flex;flex-direction:column;gap:12px">${list.map(s => s.open ? sourceCard(s, list.indexOf(s)) : sourceRow(s, list.indexOf(s))).join('')}
      <button type="button" class="dashed" data-action="add-src" data-room="${room.id}">${IC.plus()}Добавить источник в «${esc(room.name)}»</button></div>
      <div class="row" style="padding:22px 24px"><div class="grow"><strong>Все источники в «${esc(room.name)}» добавлены?</strong><span class="muted small">Переходите к следующему помещению или дальше — к выбору управления.</span></div><button type="button" class="btn primary" data-action="add-room">${IC.plus()}Добавить помещение</button></div>
      ${note('Две группы спотов на разных клавишах — это две карточки. Так конфигуратор сам посчитает зоны и подберёт устройства с нужным числом каналов.')}`;
  }

  /* ---------- step 3: controls ---------- */
  function controlOptions() {
    if (!expert()) return OPT.controls;
    if (['TRIAC', 'RF'].includes(state.proto)) return OPT.controls.filter(o => ['wall', 'remote', 'unknown'].includes(o[0]));
    return OPT.controls;
  }
  function extraOptions() {
    if (!expert()) return OPT.extras;
    if (state.proto === 'TRIAC') return OPT.extras.filter(o => ['none', 'unknown'].includes(o[0]));
    if (state.proto === 'RF') return OPT.extras.filter(o => ['scenes', 'none', 'unknown'].includes(o[0]));
    return OPT.extras;
  }
  function pageControls() {
    const base = state.sources.filter(s => s.kind && s.kind !== 'strip_spi');
    const spi = state.sources.filter(s => s.kind === 'strip_spi');
    return `<section class="card">
      ${base.length ? q('Как пользователь хочет управлять светом?', choice('controls', controlOptions(), { multi: true, wide: true }), 'Можно выбрать несколько. Смартфон и голос — это Wi-Fi, ZigBee или DALI через конвертер.' + (spi.length ? ' Динамическая лента управляется отдельно.' : '')) : note('Динамической лентой управляем так, как выбрано в её карточке.')}
      ${extraOptions().length > 2 ? q('Что ещё нужно?', choice('extras', extraOptions(), { multi: true, wide: true })) : ''}
      ${state.extras.includes('scenes') ? q('Сколько сцен нужно сохранять?', choice('scenes', OPT.scenes), 'Пульты RF и простые панели DALI хранят до 4 сцен.') : ''}
    </section>`;
  }

  /* ---------- step 4: results ---------- */
  function spiMethodFor(o) { const base = state.sources.some(s => s.kind && s.kind !== 'strip_spi'); return o.methods.includes('WIFI') ? 'Wi-Fi + SPI' : !base ? (state.sources.find(s => s.kind === 'strip_spi') || {}).spiControl === 'phone' ? 'Wi-Fi + SPI' : 'SPI' : 'SPI'; }
  function optionDesc(o) {
    if (o.kind === 'single') return DESC[o.methods[0]];
    if (o.kind === 'hybrid') return E.TITLES[o.methods[0]] + ' покрывает большинство источников, остальные получают местное управление.';
    return 'Одной системы на весь объект при этих условиях нет, поэтому каждый источник получает свой способ управления.';
  }
  function optionCard(o) {
    const key = optKey(o), sel = state.selected === key;
    const rooms = state.rooms.map(r => {
      const zs = state.sources.filter(s => s.roomId === r.id && s.kind);
      if (!zs.length) return '';
      return `<div class="broom"><h3>${esc(r.name)}</h3>${zs.map(s => {
        const m = s.kind === 'strip_spi' ? spiMethodFor(o) : E.TITLES[o.assign[s.id]] || '—';
        const f = (s.stripSku ? s.stripSku + ' · ' : '') + (s.features.map(x => FEAT_LABEL[x]).join(', ') || 'Функции не указаны');
        return `<div class="bz"><span class="n"><span>${esc(srcTitle(s))}</span><small>${esc(f)}</small></span>${pmark(m)}</div>`;
      }).join('')}</div>`;
    }).join('');
    const pros = (o.pros || []).map(x => `<li>${IC.check(20)}<span>${esc(x)}</span></li>`).join('');
    const cons = (o.cons || []).map(x => `<li style="color:#5A3B00">${IC.minus(20)}<span>${esc(x)}</span></li>`).join('');
    const spiNote = state.sources.some(s => s.kind === 'strip_spi') && o.methods[0] !== 'SPI' ? note('Динамическая лента — отдельная подсистема: ' + (o.methods.includes('WIFI') ? 'контроллер Wi-Fi–SPI, управление из того же приложения.' : 'SPI-контроллер с собственным пультом, в общие сцены не входит.')) : '';
    return `<section class="option${sel ? ' sel' : ''}">
      <div class="option-head"><div class="t"><span class="badge ${o.label}">${o.label === 'recommended' ? IC.check(16) : ''}${LABEL[o.label]}</span><h2 class="ptitle" aria-label="${esc(o.title)}">${pmarks(o.methods)}</h2><p>${esc(optionDesc(o))}</p></div>
      <button type="button" class="btn lg ${sel ? '' : 'primary'}" data-action="select-opt" data-key="${esc(key)}" aria-pressed="${sel}">${sel ? IC.check() + 'Выбрано' : 'Выбрать это решение'}</button></div>
      ${rooms ? `<div class="breakdown">${rooms}</div>` : ''}
      ${pros || cons ? `<ul class="pc">${pros}${cons}</ul>` : ''}
      ${o.caveats.length ? note('<strong>Обратите внимание</strong><ul class="list">' + o.caveats.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>', 'warn') : ''}
      ${o.pending.length ? note('<strong>Нужно уточнить</strong><ul class="list">' + o.pending.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>') : ''}
      ${spiNote}
    </section>`;
  }
  function pageResults() {
    const r = E.evaluate(project());
    if (r.insufficient) return `<section class="card">${note('Пока недостаточно данных: добавьте хотя бы один источник и выберите его тип.', 'warn')}<div><button type="button" class="btn primary lg" data-action="go" data-step="1">Добавить источники</button></div></section>`;
    if (state.selected && !r.options.some(o => optKey(o) === state.selected)) state.selected = null;
    if (!state.selected && r.options.length === 1) state.selected = optKey(r.options[0]);
    const tags = [label('object', state.object), state.rooms.length + ' ' + (state.rooms.length === 1 ? 'помещение' : state.rooms.length < 5 ? 'помещения' : 'помещений'), (n => n + ' ' + (n % 10 === 1 && n % 100 !== 11 ? 'зона' : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? 'зоны' : 'зон'))(state.sources.filter(s => s.kind).length), state.stage === 'finished' ? 'Ремонт завершён' : state.stage === 'before' ? 'До отделки' : '', state.internet === 'yes' ? 'Интернет есть' : state.internet === 'no' ? 'Без интернета' : '', state.controls.filter(c => c !== 'unknown').map(c => label('controls', c)).join(', ')].filter(x => x && x !== 'Не указано');
    const maybe = r.possible.map((p, i) => `<div class="maybe-card"><span class="badge maybe">Возможно</span><div><h3 style="font-size:23px">${pmark(p.title, true)}</h3><p class="muted" style="margin:6px 0 0">${esc(p.gain)}</p></div>
      <div class="chg"><strong>Что нужно изменить</strong>${p.changes.map(c => `<span style="display:flex;gap:10px">${IC.arrow()}${esc(c)}</span>`).join('')}</div>
      <button type="button" class="btn outline" style="align-self:flex-start;margin-top:auto" data-action="apply-fix" data-i="${i}">Применить и пересчитать</button></div>`).join('');
    return `<div class="tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
      ${r.options.length ? r.options.map(optionCard).join('') : `<section class="card">${note('<strong>При текущих ответах подходящего решения нет.</strong> Ниже — что можно изменить и почему не подошли остальные методы.', 'warn')}</section>`}
      ${maybe ? `<section style="display:flex;flex-direction:column;gap:16px"><div><h2>Возможно, если изменить условия</h2><p class="muted" style="margin:6px 0 0">Эти решения не подходят под текущие ответы, но станут доступны после указанных изменений.</p></div><div class="maybes">${maybe}</div></section>` : ''}
      ${r.whyNot.length ? `<details class="why"><summary>Почему не подошли остальные методы</summary>${r.whyNot.map(w => `<div class="why-row"><strong>${esc(w.title)}</strong><span class="muted">${esc(w.reasons.join(' '))}</span></div>`).join('')}</details>` : ''}
      <div class="legend"><span>Метки решений:</span><span class="badge recommended">Рекомендуем</span><span class="badge fits">Подходит</span><span class="badge caveats">Подходит с оговорками</span><span class="badge maybe">Возможно</span></div>`;
  }

  /* ---------- step 4 (expert): protocol check ---------- */
  const ICK = { ok: IC.check(20), ask: svg('<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7"/><path d="M12 17v.5"/>', 22, 1.8), warn: svg('<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17v.5"/>', 22, 2), stop: svg('<circle cx="12" cy="12" r="9"/><path d="M8 8l8 8M16 8l-8 8"/>', 26, 2) };
  function pageCheck() {
    const c = E.check(project(), state.proto), t = esc(c.title);
    const zones = c.zones, decide = zones.filter(z => z.status === 'decide').length, covered = zones.filter(z => z.status !== 'decide').length;
    let head;
    if (c.blocks.length) head = `<section class="block-card"><div style="display:flex;gap:14px;align-items:flex-start"><span style="color:#A3311A">${ICK.stop}</span><div><h2>${t} на этом объекте не подключить</h2>${c.blocks.map(b => `<p style="margin:8px 0 0">${esc(b.reason)}</p>`).join('')}</div></div>
      <div class="acts">${c.blocks.flatMap(b => b.actions).map(a => `<button type="button" class="btn" data-action="cond" data-id="${a.id}">${esc(a.label)}</button>`).join('')}<button type="button" class="btn primary" data-action="to-guided">Показать подходящие варианты</button><button type="button" class="btn" data-action="change-mode">Сменить протокол</button></div></section>`;
    else {
      const h = decide ? `${t} подходит, нужна доработка` : c.pendings.length ? `${t} подходит — осталось уточнить` : `${t} подходит для всего объекта`;

      ['Управление', state.controls.map(c => label('controls', c)).join(', ')], ['Дополнительно', state.extras.map(c => label('extras', c)).join(', ')], state.extras.includes('scenes') ? ['Сцены', label('scenes', state.scenes)] : null];
    cond.filter(c => c && c[1]).forEach(c => rows.push({ style: 'body', cells: [c[0], c[1]] }));
    rows.push({ style: 'body', cells: [''] }, { style: 'header', cells: ['Помещение', 'Зона', 'Тип источника', 'Что менять', 'Параметры', 'По движению', ''] });
    for (const r of state.rooms) for (const s of state.sources.filter(x => x.roomId === r.id && x.kind)) {
      const ld = E.loadOf(s), parts = [];
      if (s.stripSku) parts.push('Артикул ' + s.stripSku);
      const v = E.voltageOf(s); if (v) parts.push(v + ' В');
      if (s.length && s.wpm) parts.push(s.length + ' м × ' + s.wpm + ' Вт/м');
      if (s.units && s.unitPower) parts.push(s.units + ' шт × ' + s.unitPower + ' Вт'); else if (s.units) parts.push(s.units + ' шт');
      if (ld !== null) parts.push(ld.toLocaleString('ru-RU') + ' Вт');
      if (s.current) parts.push(s.current + ' мА');
      if (s.wet === 'yes') parts.push('влажная зона');
      rows.push({ style: 'body', cells: [r.name, s.name || '', KIND_UI[s.kind][0], s.features.map(f => FEAT_LABEL[f]).join(', '), parts.join(' · '), r.motion ? 'да' : ''] });
    }
    rows.push({ style: 'body', cells: [''] }, { style: 'section', cells: ['Оборудование — ' + o.title, '', '', '', '', '', ''] }, { style: 'header', cells: ['Помещение', 'Зона', 'Метод', 'Оборудование', 'Артикул', 'Альтернативные варианты', 'Кол-во'] });
    const line = (room, zone, method, it, altExtra) => {
      if (!isDevice(it) && !it.system) return;
      const main = it.skus[0] || (it.system ? 'Система Maytoni' : '—');
      const alts = [...it.skus.slice(1), ...(altExtra ? [altExtra] : [])].join(', ');
      rows.push({ style: 'body', cells: [room, zone, method, it.type.replace(/ — .*/, ''), main, alts, it.system ? '' : String(it.qty || 1)] });
    };
    eq.project.forEach(it => line('Весь объект', '', o.title, it));
    for (const r of eq.rooms) {
      r.roomItems.forEach(it => line(r.name, 'Всё помещение', '', it));
      for (const z of r.zones) {
        z.items.forEach(it => line(r.name, z.name, z.method, it));
        if (z.variants.length) {
          const alt = z.variants.slice(1).map(v => 'или: ' + v.items.filter(isDevice).map(i => i.type.replace(/ — .*/, '') + (i.skus[0] ? ' ' + i.skus[0] : '')).join(' + ')).join('; ');
          z.variants[0].items.forEach((it, i) => line(r.name, z.name, z.method, it, i === 0 ? alt : ''));
        }
      }
    }
    const bytes = X.build(rows, [18, 24, 26, 30, 30, 34, 8], 'Подбор');
    const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Maytoni_подбор_управления.xlsx';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('Файл Excel сохранён');
  }

  /* ---------- render & navigation ---------- */
  function render() {
    if (!state.mode) {
      $('#steps').parentElement.hidden = true;
      $('#eyebrow').textContent = '';
      $('#title').textContent = 'Подбор управления освещением';
      $('#lead').innerHTML = 'Онлайн-инструмент для предварительного подбора: поможет выбрать способ управления светом для вашего проекта и составить список оборудования.<br><br>Укажите ключевые параметры объекта — конфигуратор предложит наиболее подходящий протокол и подберёт управляющие устройства из ассортимента Maytoni. Если протокол уже выбран, начните с раздела «Я знаю, какой протокол нужен».';
      $('#page').innerHTML = pageStart(); animate('start');
      $('#bar').style.width = '0%'; $('#back').hidden = true; $('#next').classList.remove('soft-off');
      $('#next').innerHTML = 'Начать ' + IC.arrow();
      save(); return;
    }
    $('#steps').parentElement.hidden = false;
    const st = state.step, ex = expert(), ok = ready();
    const names = STEPS.map((t, i) => i === 3 && ex ? 'Проверка' : t);
    $('#steps').innerHTML = names.map((t, i) => `<button type="button" class="step${i < st ? ' done' : ''}${i === st ? ' cur' : ''}" data-action="go" data-step="${i}" ${i === st ? 'aria-current="step"' : ''} ${i > 3 && !ok ? 'disabled' : ''}><i>${i < st ? '✓' : i + 1}</i>${t}</button>`).join('');
    $('#eyebrow').textContent = 'Шаг ' + (st + 1) + ' из ' + STEPS.length;
    const meta = ex && st === 3 ? ['Проверка: ' + E.TITLES[state.proto], 'Смотрим, как выбранный протокол ложится на ваш объект: что он покрывает, где нужна доработка и что стоит уточнить.'] : ex && st === 0 ? ['Объект и условия', 'Только вопросы, важные для ' + E.TITLES[state.proto] + '.'] : META[st];
    $('#title').textContent = meta[0];
    $('#lead').textContent = meta[1];
    $('#page').innerHTML = modeBar() + [pageObject, pageSources, pageControls, ex ? pageCheck : pageResults, pageParams, pageEquipment][st]();
    animate('s' + st + state.mode);
    $('#bar').style.width = ((st + 1) / STEPS.length * 100) + '%';
    $('#back').hidden = false;
    $('#next').classList.toggle('soft-off', (st === 3 && !ready()) || (st === 0 && !!earlyBlock()));
    $('#next').innerHTML = ['Далее', 'Далее', ex ? 'Проверить протокол' : 'Подобрать решение', 'Уточнить параметры', 'Подобрать оборудование', 'Скачать Excel'][st] + (st < 5 ? ' ' + IC.arrow() : '');
    save();
  }
  let lastView = null, animTimer;
  function animate(view) {
    if (view === lastView) return; lastView = view;
    const pg = $('#page'); pg.classList.remove('anim'); void pg.offsetWidth; pg.classList.add('anim');
    clearTimeout(animTimer); animTimer = setTimeout(() => pg.classList.remove('anim'), 700);
  }
  function startFlow() {
    if (state.startPick === 'expert' && !state.proto) { toast('Выберите протокол'); return; }
    const hasData = state.sources.some(s => s.kind);
    state.mode = state.startPick;
    if (state.mode === 'expert') state.step = hasData ? 3 : (['TRIAC', 'RF'].includes(state.proto) ? 1 : 0);
    else state.step = hasData ? Math.min(state.step, 3) : 0;
    render(); window.scrollTo(0, 0);
  }
  function go(step) {
    step = Math.max(0, Math.min(5, step));
    if (step > 0 && earlyBlock()) { state.step = 0; render(); toast(E.TITLES[state.proto] + ' не подходит для этого объекта — выберите другой протокол'); return; }
    if (step >= 2 && state.step <= 1 && !validSources()) return;
    if (step > 3 && !ready()) { toast(expert() ? 'Сначала решите отмеченные вопросы проверки' : 'Сначала выберите решение'); step = 3; }
    state.step = step; render(); window.scrollTo(0, 0); $('#title').focus({ preventScroll: true });
  }
  function validSources() {
    const bad = state.sources.find(s => !s.kind);
    if (!state.sources.length) { toast('Добавьте хотя бы один источник'); return false; }
    if (bad) {
      state.step = 1; state.activeRoom = bad.roomId; state.sources.forEach(s => s.open = s.id === bad.id); render();
      const qv = String(bad.stripQuery || '').trim();
      if (bad.cat === 'strip' && bad.stripMode === 'sku' && qv) toast(E.STRIPS_220[qv] ? 'Лента ' + qv + ' на 220 В не подходит — выберите ленту 12–48 В' : 'Лента ' + qv + ' не найдена — введите артикул из списка или выберите ленту по параметрам');
      else toast('Выберите тип источника «' + srcTitle(bad) + '» или удалите карточку');
      return false;
    }
    return true;
  }
  let toastTimer, undoState = null;
  function toast(t, undo) {
    const el = $('#toast');
    el.innerHTML = esc(t) + (undo ? ' <button type="button" class="toast-btn" data-action="undo">Вернуть</button>' : '');
    el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; if (undo) undoState = null; }, undo ? 8000 : 3200);
  }
  let modalAction = null, modalReturn = null;
  function ask(title, text, okLabel, onOk) {
    modalAction = onOk; modalReturn = document.activeElement;
    $('#modal-title').textContent = title; $('#modal-text').textContent = text; $('#modal-ok').textContent = okLabel;
    $('#modal').hidden = false; $('#modal-ok').focus();
  }
  function closeModal() { $('#modal').hidden = true; modalAction = null; if (modalReturn && modalReturn.focus) modalReturn.focus(); }
  function resetAll() {
    undoState = JSON.stringify(state);
    state = defaults(); render(); window.scrollTo(0, 0);
    toast('Все ответы очищены', true);
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.id === 'next') { if (!state.mode) { startFlow(); return; } if (state.step === 5) exportExcel(); else go(state.step + 1); return; }
    if (b.id === 'back') { if (state.step === 0 || (localProto() && state.step === 1)) { state.mode = null; render(); return; } go(state.step - 1); return; }
    if (b.id === 'reset' || b.dataset.action === 'reset') { ask('Очистить все ответы?', 'Помещения, источники и все выбранные параметры будут удалены. Сразу после очистки их можно вернуть.', 'Очистить всё', resetAll); return; }
    if (b.id === 'modal-ok') { const f = modalAction; closeModal(); if (f) f(); return; }
    if (b.id === 'modal-cancel') { closeModal(); return; }
    if (b.dataset.action === 'undo') { if (undoState) { state = Object.assign(defaults(), JSON.parse(undoState)); undoState = null; render(); $('#toast').hidden = true; toast('Ответы восстановлены'); } return; }
    const s = b.dataset.src ? src(b.dataset.src) : null;
    if (b.dataset.choice) {
      const key = b.dataset.choice, v = b.dataset.value;
      if (s) s[key] = v;
      else if (b.dataset.multi) {
        let arr = state[key].slice();
        if (v === 'none' || v === 'unknown') arr = arr.includes(v) ? [] : [v];
        else { arr = arr.filter(x => x !== 'none' && x !== 'unknown'); arr = arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v]; }
        state[key] = arr;
      } else state[key] = v;
      if (key === 'stage' && v === 'finished' && state.bus === 'approved') state.bus = '';
      if (state.step <= 2) invalidate();
      render(); return;
    }
    const a = b.dataset.action; if (!a) return;
    if (a === 'go') go(Number(b.dataset.step));
    if (a === 'start-pick') { state.startPick = b.dataset.mode; render(); }
    if (a === 'pick-proto') { state.proto = b.dataset.proto; state.startPick = 'expert'; render(); }
    if (a === 'change-mode') { state.startPick = state.mode === 'expert' ? 'expert' : 'expert'; state.mode = null; render(); window.scrollTo(0, 0); }
    if (a === 'guided-start') { state.mode = 'guided'; state.startPick = 'guided'; state.selected = null; state.step = 0; render(); window.scrollTo(0, 0); }
    if (a === 'to-guided') { state.mode = 'guided'; state.startPick = 'guided'; state.selected = null; state.step = 3; render(); window.scrollTo(0, 0); }
    if (a === 'cond') { const id = b.dataset.id; if (id === 'internet-yes') state.internet = 'yes'; if (id === 'bus-existing') state.bus = 'existing'; if (id === 'bus-approved') { state.bus = state.stage === 'finished' ? 'existing' : 'approved'; if (!state.stage || state.stage === 'unknown') state.stage = 'before'; } render(); toast('Условие обновлено'); }
    if (a === 'zone-fix') {
      const c = checkNow(); const z = c.zones.find(x => x.id === b.dataset.src); const ch = z && z.choices[Number(b.dataset.i)]; if (!ch) return;
      undoState = JSON.stringify(state);
      if (ch.type === 'local') state.zoneFix[s.id] = ch.value;
      if (ch.type === 'drop') s.features = ch.value.slice();
      if (ch.type === 'phase') s.phaseDim = 'yes';
      if (ch.type === 'replace') { const allow = E.KINDS[ch.value].feats; s.kind = ch.value; s.stripSku = ''; s.stripMode = 'params'; s.features = s.features.filter(f => allow.includes(f)); }
      render(); toast(ch.type === 'local' ? 'Источник переведён на ' + E.TITLES[ch.value] : 'Источник изменён', true);
    }
    if (a === 'zone-unfix') { delete state.zoneFix[s.id]; render(); }
    if (a === 'edit-src') { state.activeRoom = s.roomId; state.sources.forEach(x => { if (x.roomId === s.roomId) x.open = x.id === s.id; }); state.step = 1; render(); window.scrollTo(0, 0); }
    if (a === 'set-cat') { s.cat = b.dataset.cat; s.kind = null; s.features = []; invalidate(); render(); }
    if (a === 'set-kind') { const kd = b.dataset.kind, allow = E.KINDS[kd].feats; s.kind = kd; s.features = allow.length === 1 ? ['onoff'] : kd === 'strip_spi' ? ['fx'] : s.features.filter(f => allow.includes(f)); if (kd.startsWith('track')) s.voltage = ''; invalidate(); render(); }
    if (a === 'strip-mode') { s.stripMode = b.dataset.mode; if (s.stripMode === 'params') { s.stripSku = ''; } else if (!s.stripSku) { s.kind = null; s.features = []; } invalidate(); render(); setTimeout(() => { const el = document.getElementById(s.id + '-sq'); if (el) el.focus(); }, 0); }
    if (a === 'strip-clear') { s.stripSku = ''; s.stripQuery = ''; s.kind = null; s.features = []; invalidate(); render(); setTimeout(() => { const el = document.getElementById(s.id + '-sq'); if (el) el.focus(); }, 0); }
    if (a === 'toggle-feat') { const f = b.dataset.feat; s.features = s.features.includes(f) ? s.features.filter(x => x !== f) : [...s.features, f]; invalidate(); render(); }
    if (a === 'open-src') { state.sources.forEach(x => { if (x.roomId === s.roomId) x.open = x.id === s.id; }); render(); }
    if (a === 'close-src') { s.open = false; render(); }
    if (a === 'delete-src') { if (state.sources.length === 1) { toast('Должен остаться хотя бы один источник'); return; } state.sources = state.sources.filter(x => x.id !== s.id); delete state.zoneFix[s.id]; invalidate(); render(); }
    if (a === 'add-src') { state.sources.forEach(x => { if (x.roomId === b.dataset.room) x.open = false; }); state.sources.push(newSource(b.dataset.room)); render(); }
    if (a === 'toggle-motion') { const r = state.rooms.find(x => x.id === b.dataset.room); r.motion = !r.motion; invalidate(); render(); }
    if (a === 'select-room') { state.activeRoom = b.dataset.room; render(); }
    if (a === 'add-room') { const id = uid('r'); state.rooms.push({ id, name: 'Помещение ' + (state.rooms.length + 1) }); state.activeRoom = id; state.sources.push(newSource(id)); render(); setTimeout(() => { const el = $('#room-name'); if (el) { el.focus(); el.select(); } }, 0); }
    if (a === 'delete-room') { const id = b.dataset.room; ask('Удалить помещение «' + roomName(id) + '»?', 'Вместе с ним удалятся все его источники света.', 'Удалить', () => { undoState = JSON.stringify(state); state.rooms = state.rooms.filter(r => r.id !== id); state.sources = state.sources.filter(x => x.roomId !== id); if (!state.sources.length) state.sources.push(newSource(state.rooms[0].id)); state.activeRoom = state.rooms[0].id; invalidate(); render(); toast('Помещение удалено', true); }); }
    if (a === 'dali-split') { state.daliSplit = b.dataset.val; render(); }
    if (a === 'select-opt') { state.selected = b.dataset.key; render(); }
    if (a === 'apply-fix') {
      const r = E.evaluate(project()); const p = r.possible[Number(b.dataset.i)]; if (!p) return;
      const before = p.title;
      for (const f of p.fixes) { const nq = E.applyFix(state, f); state.internet = nq.internet; state.budget = nq.budget; state.bus = nq.bus; state.controls = nq.controls; }
      invalidate(); render(); window.scrollTo(0, 0); toast('Условия изменены — теперь подходит ' + before);
    }
    if (a === 'export') exportExcel();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.roomName) { const r = state.rooms.find(x => x.id === el.dataset.roomName); r.name = el.value.slice(0, 60) || 'Помещение'; document.querySelectorAll(`[data-room="${r.id}"] strong`).forEach(n => n.textContent = r.name); save(); return; }
    if (el.dataset.src && el.dataset.field) {
      const s = src(el.dataset.src); s[el.dataset.field] = el.value;
      if (el.dataset.field === 'stripQuery') {
        const v = el.value.trim().split(/\s/)[0];
        if (E.STRIPS[v] || E.STRIPS[v.padStart(6, '0')]) { applyStrip(s, E.STRIPS[v] ? v : v.padStart(6, '0')); invalidate(); render(); return; }
        const msg = document.querySelector(`[data-stripmsg="${s.id}"]`);
        if (msg) msg.innerHTML = stripMsg(el.value);
      }
      if (el.dataset.field === 'name') { const h = el.closest('.card') && el.closest('.card').querySelector('h3'); if (h) h.textContent = srcTitle(s); }
      const out = document.querySelector(`[data-loadout="${s.id}"] strong`); if (out) { const ld = E.loadOf(s); out.textContent = ld === null ? 'не указана' : ld.toLocaleString('ru-RU') + ' Вт'; }
      const dc = document.querySelector('[data-dalicard]'); if (dc) { const o = currentOption(); if (o) dc.innerHTML = daliCard(o); }
      save();
    }
  });
  const dl = document.createElement('datalist'); dl.id = 'strip-list';
  dl.innerHTML = Object.values(E.STRIPS).map(st => `<option value="${esc(st.sku)}">${esc(st.name)}</option>`).join('');
  document.body.appendChild(dl);
  render();
})();
