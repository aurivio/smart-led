function matrixSupport(id,s){
 if(id==='SWITCH'||isSPI(s)||s.type==='unknown')return {ok:true};
 const cell=matrixCells[s.type]?.[id];
 if(s.type==='lowv'&&numeric(s.voltage)!==null&&![12,24].includes(numeric(s.voltage)))return {ok:false,reason:'Для этого типа светильника матрица описывает питание только 12–24 В.'};
 if(cell==='x')return {ok:false,reason:typeName(s)+': в матрице нет решения '+proto[id].title+'.'};
 const f=s.features.filter(x=>x!=='unknown'),regulates=f.some(x=>x!=='onoff');
 const onlySwitch=(['DALI','WIFI','ZIGBEE'].includes(id)&&s.type==='led_integrated')||(id==='WIFI'&&s.type==='track48');
 if(onlySwitch&&regulates)return {ok:false,reason:typeName(s)+': для '+proto[id].title+' в матрице предусмотрено только включение и выключение.'};
 if(['lamp','track230','led_external'].includes(s.type)&&f.some(x=>['rgb','cct'].includes(x))&&['TRIAC','WIFI','ZIGBEE'].includes(id))return {ok:false,reason:typeName(s)+': фазовое диммирование не регулирует цвет и цветовую температуру.'};
 if(['lamp','track230'].includes(s.type)&&f.some(x=>['rgb','cct'].includes(x))&&id==='DALI')return {ok:false,reason:typeName(s)+': указанный в матрице модуль DALI DT6 TRIAC регулирует только яркость.'};

function sourceVoltage(s){return s.type==='track24'?24:s.type==='track48'?48:numeric(s.voltage);}
function sourceLoad(s){
 const direct=numeric(s.load);if(direct!==null)return {value:direct,how:'Указанная нагрузка одного участка / группы'};
 if(s.type?.startsWith('strip_')){const l=numeric(s.length),p=numeric(s.power);return {value:l!==null&&p!==null?Math.round(l*p*1000)/1000:null,how:'Длина × мощность на метр'};}
 const p=numeric(s.unitPower),n=numeric(s.units);return {value:p!==null&&n!==null?Math.round(p*n*1000)/1000:null,how:'Мощность одного светильника × количество'};

function formatNumber(x){return x===null||x===undefined?'не указано':new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(x);}
function productSpec(p){const out=[];if(p.volts)out.push(p.volts.join(' / ')+' В');if(p.limits)out.push(Object.entries(p.limits).map(([v,n])=>v+' В: до '+n+' Вт').join('; '));if(p.current)out.push((p.current[0]===p.current[1]?p.current[0]:p.current.join('–'))+' мА');if(p.channels)out.push(p.channels+' кан.');if(p.neutral==='no')out.push('без нейтрали');if(p.outputs)out.push(p.outputs+' выхода');return out.join(' · ');}
function matchProduct(sku,s,role){

 if(!p)return {sku,fail:['Артикул отсутствует в каталоге матрицы.'],pending:[],spec:''};
 if(['cv','psu','spi'].includes(role)){
  if(p.volts){if(v===null)pending.push('Уточнить напряжение');else if(!p.volts.includes(v))fail.push('Не поддерживает '+v+' В');}
  else pending.push('Проверить напряжение устройства');
  if(p.limits&&v!==null&&Object.hasOwn(p.limits,v)){if(load===null)pending.push('Уточнить нагрузку');else if(load>p.limits[v]+1e-9)fail.push('Нагрузка '+formatNumber(load)+' Вт превышает '+p.limits[v]+' Вт');}
  else if(p.limits&&v===null)pending.push('Уточнить нагрузку при выбранном напряжении');
  else pending.push('В матрице не указан предел мощности');
 }
 if(role==='driver'){
  if(p.current){if(current===null)pending.push('Уточнить ток светильника');else if(current<p.current[0]||current>p.current[1])fail.push('Ток вне диапазона '+p.current.join('–')+' мА');}
  else pending.push('Проверить ток драйвера');
  pending.push('Сверить выходное напряжение и мощность драйвера: этих пределов нет в матрице');
 }
 if(role==='phase')pending.push('Уточнить допустимую LED-нагрузку и совместимость диммирования');
 if(role==='switch')pending.push('Уточнить нагрузку, пусковые токи и схему подключения');
 if(s.neutral==='no'&&role==='switch'&&sku.startsWith('M')){
  if(p.neutral!=='no')pending.push('Работа без нейтрали не подтверждена в матрице');
 }
 if(p.note)pending.push(p.note);
 return {sku,spec:productSpec(p),pending:[...new Set(pending)],fail};
}

 if(s.sources.some(isSPI)&&s.sources.some(x=>!isSPI(x)))report.notes.push(id==='WIFI'?'SPI подключается через совместимый Wi-Fi–SPI-контроллер.':'SPI работает от отдельного пульта. Общие сцены основного света на неё не распространяются.');

}

function roomName(s,id){return s.rooms.find(r=>r.id===id)?.name||'Помещение 1';}
function spiMode(s,method,src){return s.sources.some(x=>!isSPI(x))?(method==='WIFI'?'phone':'remote'):src.spiControl;}
function sourcesInRoom(s,id){return s.sources.filter(x=>x.roomId===id);}
function plainComponent(type,products=[],note='',quantity=null){return {type,products,unmatched:false,excluded:[],note,pending:[...new Set(products.flatMap(p=>p.pending||[]))],quantity};}
function buildEquipment(raw,selected){
 const s=normalize(raw),id=selected||s.selected;
 for(const src of s.sources)if(isSPI(src))src.spiControl=spiMode(s,id,src);
 const report=buildEquipmentBase(s,id);
 report.rooms=s.rooms.map(r=>({...r,items:[],sources:report.sources.filter(x=>x.roomId===r.id)}));
 if(id==='ZIGBEE')for(const item of report.system)if(item.type.startsWith('ZigBee-хаб')){item.quantity=1;item.type='ZigBee-хаб на весь проект';}
 if(id==='TRIAC'){
  report.system=report.system.filter(x=>!x.type.startsWith('Пульт, синхронизированный'));
  for(const room of report.rooms){
   if(!room.sources.some(x=>x.sourceType!=='strip_spi'))continue;
   room.items.push(plainComponent('Роторная панель TRIAC',KIT.triac.map(sku=>matchProduct(sku,{},'phase')),'Одна панель на помещение. Артикулы — варианты на выбор; допустимую суммарную нагрузку и число независимых групп уточнить.',1));
   if(s.controls.includes('remote'))room.items.push(plainComponent('Пульт для панели TRIAC',[],'Синхронизируется с совместимой панелью этого помещения. Артикул уточняется.',1));
  }
  for(const src of report.sources)for(const pack of src.packages)pack.items=pack.items.filter(x=>!x.type.startsWith('Светорегулятор TRIAC'));
 }
 if(id==='RF'){
  // A remote is scoped to a room and a source type. Each source card keeps
  // its own controller/load check so independent sections are not merged.
  for(const room of report.rooms){
   const types=new Map();
   for(const src of room.sources){
    if(src.sourceType==='strip_spi'||!src.packages.length)continue;
    const original=s.sources.find(x=>x.id===src.id);
    const f=original.features;
    const mode=original.type==='strip_rgbcct'?'RGBCCT':original.type==='strip_rgbw'?'RGBW':original.type==='strip_rgb'||f.includes('rgb')?'RGB':original.type==='strip_cct'||f.includes('cct')?'CCT':'Dim';
    const key=original.type+'|'+mode;
    if(!types.has(key)){
     types.set(key,true);
     const label=mode==='Dim'?'DIM':mode==='CCT'?'MIX':mode;
     room.items.push(plainComponent('Пульт RF '+label+' — '+typeName(original),KIT['remote'+mode].map(sku=>matchProduct(sku,{},'')),'Отдельный пульт для этого типа источников в данном помещении.',1));
    }
    for(const pack of src.packages){pack.items=pack.items.filter(x=>!x.type.startsWith('Пульт RF '));for(const item of pack.items)if(/^(Диммер RF|Контроллер RF)/.test(item.type)){item.quantity=1;item.note=[item.note,'Отдельный контроллер для этого участка в помещении «'+room.name+'».'].filter(Boolean).join(' ');}}
   }
  }
 }
 report.notes=report.notes.filter(n=>!n.startsWith('Артикулы в одном списке'));
 report.notes.unshift('Артикулы внутри одного списка — альтернативы: выбирается один подходящий вариант. Устройства из разных вариантов комплекта не суммируются.');
 return report;
}
function roomHeading(room,count){return '<div class="room-heading"><span class="room-symbol" aria-hidden="true">'+icon('spark',18)+'</span><div><h2>'+esc(room.name)+'</h2><p class="small-muted">'+count+' позиций света</p></div></div>';}
function projectConditions(s,rep){return [
 ['Объект',label('object',s.object)],['Помещения',s.rooms.map(r=>r.name).join(', ')],['Метод управления',rep.title],
 ['Группы во всём проекте',label('groups',s.groups)],['Бюджет',label('budget',s.budget)],['Стадия ремонта',label('stage',s.stage)],
 ...(rep.method==='DALI'?[['Шина DALI',label('bus',s.bus)]]:[]),
 ['Стабильный интернет',s.internet==='yes'?'Есть':s.internet==='no'?'Нет':'Не указан'],
 ['Управление',s.controls.map(c=>label('controls',c)).join(', ')],

/* XLSX layout/styles are authored with @oai/artifact-tool at build time.

function xmlSafe(v){return String(v??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));}

 if(typeof v==='number'&&Number.isFinite(v))return '<c r="'+ref+'" s="'+style+'"><v>'+v+'</v></c>';

function exportRows(s,rep){

 {kind:'section',cells:['Условия проекта']}];
 for(const [key,value] of projectConditions(s,rep))rows.push({kind:'condition',cells:[key,value]});

 for(const room of s.rooms)for(const src of sourcesInRoom(s,room.id))rows.push({kind:'source',cells:[room.name,sourceCondition(src)]});

 rows.push({kind:'note',cells:['Артикулы в одной ячейке — варианты на выбор. Альтернативные комплекты не суммируются. Параметры и совместимость уточняются перед закупкой.']});

  const skus=item.products.map(p=>p.sku).join('\n');
  const conditions=[item.quantity?item.quantity+' шт.':'',variant, item.unmatched?'Подходящий артикул не найден':!skus?'Артикул уточняется':'',...pending];
  if(item.products.some(p=>p.pending.length))conditions.push('Требуется уточнение параметров');
  rows.push({kind:'equipment',cells:[room,source,item.type,skus,[...new Set(conditions.filter(Boolean))].join('. ')]});
 };
 for(const item of rep.system)add('Весь проект','Общее оборудование',item);
 for(const room of rep.rooms){
  for(const item of room.items)add(room.name,'Управление помещением',item);
  for(const src of room.sources){
   if(!src.packages.length)rows.push({kind:'equipment',cells:[room.name,src.name,'Требуется уточнение','',src.pending.join('. ')]});
   for(const pack of src.packages)for(const item of pack.items)add(room.name,src.name,item,src.packages.length>1?pack.title:'',src.pending);
  }

function wrapExcelText(value,width){

function exportSheetXml(template,rows){

  const row=rows[i],r=i+2;let cells=[],height=26;
  if(['title','warning','note','section'].includes(row.kind)){
   cells=[xlsxCell('A'+r,row.cells[0],styles[row.kind])];merges.push('A'+r+':E'+r);
   height=row.kind==='title'?34:row.kind==='section'?30:Math.max(34,Math.ceil(String(row.cells[0]).length/130)*16+12);
  }else if(row.kind==='condition'||row.kind==='source'){
   const source=row.kind==='source';
   merges.push((source?'B':'C')+r+':E'+r);if(!source)merges.push('A'+r+':B'+r);
   const title=wrapExcelText(row.cells[0],source?20:40),value=wrapExcelText(row.cells[1],source?110:88);
   cells=[xlsxCell('A'+r,title,styles.label),xlsxCell((source?'B':'C')+r,value,styles.body)];
   height=Math.max(28,value.split('\n').length*16+12,title.split('\n').length*16+12);
  }else{
   const widths=[20,29,38,31,39];
   const values=row.cells.map((v,c)=>c===3?v:wrapExcelText(v,widths[c]));
   cells=values.map((v,c)=>xlsxCell(String.fromCharCode(65+c)+r,v,row.kind==='header'?styles.header:c===3?styles.sku:styles.body));
   height=row.kind==='header'?36:Math.max(42,...values.map(v=>String(v||'').split('\n').length*16+12));
  }
  body+='<row r="'+r+'" ht="'+Math.min(409,height)+'" customHeight="1">'+cells.join('')+'</row>';
 }
 let xml=template.replace(/<sheetData[\s\S]*?<\/sheetData>/,'<sheetData>'+body+'</sheetData>');
 xml=xml.replace(/<dimension[^>]*\/>/,'<dimension ref="A1:E'+(rows.length+1)+'"/>').replace(/<mergeCells[\s\S]*?<\/mergeCells>/,'');
 xml=xml.replace('</sheetData>','</sheetData><mergeCells count="'+merges.length+'">'+merges.map(ref=>'<mergeCell ref="'+ref+'"/>').join('')+'</mergeCells>');

}

function input(s,key,title,{placeholder='Не знаю / не заполнено',min='0.1',step='any',type='number'}={}){const id=`${s.id}-${key}`;return `<div class="field"><label class="field-label" for="${id}">${title}</label><input class="input" id="${id}" data-source="${s.id}" data-field="${key}" type="${type}" ${type==='number'?`min="${min}" step="${step}" inputmode="${step==='1'?'numeric':'decimal'}"`:''} value="${esc(s[key])}" placeholder="${esc(placeholder)}" ${type==='text'?'maxlength="60"':''}></div>`;}
function sourceCard(s,index){const available=validFeatures(s.type), features=OPTIONS.features.filter(x=>available.includes(x[0])), brief=s.features.includes('unknown')?'Функции пока не определены':s.features.map(x=>label('features',x)).join(' · ');
 return `<details class="source-card" data-card="${s.id}" ${s.open?'open':''}><summary class="source-summary"><span class="source-number">${String(index+1).padStart(2,'0')}</span><span class="source-summary-copy"><strong data-source-title="${s.id}">${esc(s.name||typeName(s))}</strong><small>${esc(brief)}</small></span><span class="source-chevron">${icon('down',16)}</span><button class="icon-btn" type="button" data-action="delete-source" data-id="${s.id}" aria-label="Удалить источник ${index+1}">${icon('trash',17)}</button></summary><div class="source-body">${field('Тип источника',`<select class="select" aria-label="Тип источника ${index+1}" data-source="${s.id}" data-field="type">${TYPES.map(([v,l])=>`<option value="${v}" ${v===s.type?'selected':''}>${esc(l)}</option>`).join('')}</select>`)}${field('Название или зона — необязательно',`<input class="input" data-source="${s.id}" data-field="name" aria-label="Название источника ${index+1}" type="text" maxlength="60" value="${esc(s.name)}" placeholder="Например, подвесы над столом">`)}${field('Что нужно менять?',choiceGroup('features',features,{multiple:true,source:s,columns:'two'}),'Можно выбрать несколько функций. Включение и выключение доступно и при регулировке яркости или цвета.')}${isFixture(s)?`<div style="margin-top:22px">${input(s,'quantity','Самая большая группа с этим типом: светильников всего',{min:'1',step:'1'})}<p class="hint">Считайте все светильники в такой группе, включая другие типы. Для TRIAC — не более 15. Если группы ещё не определены, поле можно пропустить.</p></div>`:''}${isSPI(s)&&state.sources.every(isSPI)?`<div class="conditional">${field('Как управлять этой SPI-подсветкой?',choiceGroup('spiControl',undefined,{source:s}),'Для смартфона используется Wi-Fi–SPI-контроллер. Этот выбор относится только к данной подсветке.')}</div>`:''}</div></details>`;
}
function sourcesPage(){
 const room=state.rooms.find(r=>r.id===state.activeRoom)||state.rooms[0],list=sourcesInRoom(state,room.id);
 return '<div class="room-tabs" aria-label="Помещения">'+state.rooms.map(r=>'<button type="button" class="room-tab '+(r.id===room.id?'active':'')+'" data-action="select-room" data-room="'+r.id+'" aria-pressed="'+(r.id===room.id)+'"><strong data-room-title="'+r.id+'">'+esc(r.name)+'</strong><span>'+sourcesInRoom(state,r.id).length+' позиций света</span></button>').join('')+'</div>'+
 '<section class="section room-editor"><div class="room-editor-title"><label class="field-label" for="room-name">Название помещения</label>'+(state.rooms.length>1?'<button type="button" class="text-btn" data-action="delete-room" data-room="'+room.id+'">Удалить помещение</button>':'')+'</div><input class="input" id="room-name" data-room-name="'+room.id+'" maxlength="60" value="'+esc(room.name)+'" placeholder="Например, гостиная"><p class="hint">Все источники ниже относятся к этому помещению.</p></section>'+
 '<div class="source-list">'+list.map(sourceCard).join('')+'</div>'+
 '<button type="button" class="btn btn-outline add-source" data-action="add-source" data-room="'+room.id+'">'+icon('plus')+'Добавить ещё источник в это помещение</button>'+
 '<div class="add-room-box"><div><h3>Все источники добавлены?</h3><p class="small-muted">Перейдите к следующему помещению или продолжите выбор управления.</p></div><button type="button" class="btn btn-primary" data-action="add-room">'+icon('plus')+'Добавить новое помещение</button></div>'+
 notice('Для всех помещений выбирается один основной протокол. SPI можно добавить отдельно: с пультом или через Wi-Fi–SPI-контроллер при выборе Wi-Fi.','subtle');
}

function controlsPage(){const base=state.sources.filter(x=>!isSPI(x)),spi=state.sources.filter(isSPI),pureSPI=spi.length>0&&!base.length, controls=state.controls.filter(x=>x!=='unknown'), digital=controls.some(x=>['phone','voice'].includes(x));return (pureSPI?section('01','Управление SPI-подсветкой',notice('Способ управления выбран в карточках источников. '+spi.map((s,i)=>`${esc(s.name||'SPI-подсветка '+(i+1))}: <strong>${esc(label('spiControl',s.spiControl))}</strong>`).join('<br>'))):section('01',spi.length?'Управление основным светом':'Привычный способ управления',`${spi.length?'<p class="controls-caption">Эти способы относятся к обычным источникам. При Wi-Fi для SPI используется Wi-Fi–SPI-контроллер; при остальных методах — отдельный пульт.</p>':''}${field('Как пользователь хочет управлять светом?',choiceGroup('controls',undefined,{multiple:true,columns:'two'}),'Можно выбрать несколько способов. Для Wi-Fi и ZigBee нужен смартфон или голос — достаточно одного.')}${controls.includes('wall')&&digital?`<div class="conditional">${field('Какой способ будет основным?',choiceGroup('priority',undefined,{columns:'two'}))}</div>`:''}`))+section('02','Дополнительные возможности',field(pureSPI?'Что ещё потребуется от SPI-контроллера?':spi.length?'Что ещё нужно для основного света?':'Что ещё нужно в проекте?',choiceGroup('extras',undefined,{multiple:true,columns:'two'}))+`${state.extras.includes('scenes')?`<div class="conditional">${field('Сколько сцен нужно сохранять?',choiceGroup('scenes'))}<p class="hint">Сцена — сохранённое состояние света, например «Ужин» или «Просмотр фильма».</p></div>`:''}`+`${pureSPI?notice('Динамические эффекты и сохраняемые сцены — разные функции. Дополнительные возможности уточняются у конкретного SPI-контроллера.','subtle'):''}`);}
function decisionCard(r,i){const active=state.selected===r.id;return `<button type="button" class="result-option" aria-pressed="${active}" data-action="select-result" data-protocol="${r.id}"><span class="rank"><span>${i===0?'01 · Лучшее соответствие':`0${i+1} · Альтернатива`}</span><span class="select-dot" aria-hidden="true">${active?'✓':''}</span></span><span class="protocol-name">${esc(r.title)}</span><span><span class="score">${r.score}<small>%</small></span><span class="score-label" style="display:block">соответствие задаче</span><span class="score-track"><i style="width:${r.score}%"></i></span></span>${r.provisional?`<span class="result-note">Есть условия для уточнения</span>`:''}</button>`;}
function exclusionsHtml(){if(!result?.excluded.length)return '';return `<details class="exclusions"><summary>Почему другие варианты не предложены?</summary>${result.excluded.map(r=>`<div class="excluded"><strong>${esc(proto[r.id].title)}</strong><div>${r.fail.slice(0,3).map(esc).join('<br>')}</div></div>`).join('')}</details>`;}
function selectedDetail(r){return `<section class="section"><div class="details-head"><div><div class="eyebrow">${state.confirmed?'Выбор подтверждён':r.id===result.candidates[0].id?(r.provisional?'Предварительная рекомендация':'Рекомендуемое решение'):'Выбранная альтернатива'}</div><h2>${r.provisional?'Может подойти':r.id===result.candidates[0].id?'Вам больше всего подходит':'Вы выбрали'} ${esc(r.title)}</h2></div><span class="pill">${r.score}% соответствия</span></div><p class="protocol-description">${esc(proto[r.id].description)}</p><div class="reason-grid">${r.reasons.map(t=>`<div class="reason">${icon('check',15)}<span>${esc(t)}</span></div>`).join('')}</div>${r.spi?`<div class="subsystem"><h3>SPI-подсветка — отдельно</h3><p>Основное освещение использует ${esc(proto[r.id].title)}. Для динамической ленты предусмотрена отдельная SPI-подсистема.</p>${state.sources.filter(isSPI).map(s=>`<p><strong>${esc(roomName(state,s.roomId)+' · '+(s.name||'SPI-подсветка'))}</strong>: ${spiMode(state,r.id,s)==='phone'?'смартфон через Wi-Fi–SPI-контроллер':'отдельный пульт'}.</p>`).join('')}</div>`:''}${r.pending.length?notice(`<strong>Что ещё уточнить</strong><ul class="list">${r.pending.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`,'amber'):''}${r.notices.length?notice(r.notices.map(esc).join('<br>')):''}</section>`;}
function resultPage(){result=evaluate(state);const tags=[known(state.object)?label('object',state.object):null,known(state.groups)?label('groups',state.groups):null,known(state.budget)?'Бюджет: '+label('budget',state.budget).toLowerCase():null,`${state.rooms.length} помещений`,`${state.sources.length} позиций света`].filter(Boolean);if(!result.candidates.some(x=>x.id===state.selected)){state.selected=result.candidates[0]?.id||null;state.confirmed=false;}if(result.insufficient)return `<div class="empty-result"><div class="empty-symbol">${icon('info',25)}</div><h2>Пока недостаточно данных для подбора</h2><p>Укажите хотя бы один тип источника и нужную функцию света. Остальные неизвестные параметры можно оставить на потом.</p><button class="btn btn-primary" type="button" data-action="go-sources">Уточнить источники ${icon('arrow',17)}</button></div>`;if(!result.candidates.length)return `<div class="empty-result"><div class="empty-symbol">${icon('info',25)}</div><h2>Единого подходящего варианта пока нет</h2><p>В ответах есть условия, которые исключают доступные решения. Ниже указано, какие именно — можно вернуться и уточнить проект.</p><button class="btn btn-primary" type="button" data-action="go-object">Уточнить параметры ${icon('arrow',17)}</button></div>${exclusionsHtml()}`;const r=result.candidates.find(x=>x.id===state.selected);return `<div class="summary-tags">${tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div class="result-grid ${result.candidates.length===1?'one':result.candidates.length===2?'two':''}">${result.candidates.map(decisionCard).join('')}</div>${selectedDetail(r)}<p class="method-note">Показано до трёх подходящих решений. Обязательные ограничения проверяются до расчёта рейтинга. Проценты отражают подтверждённые условия и предпочтения проекта; неизвестные данные не считаются совпадением. Это оценка пригодности метода, а совместимость конкретного оборудования проверяется отдельно.</p>${exclusionsHtml()}`;}
const STEPS=['Объект','Источники','Управление','Метод','Параметры','Подбор'];
const META=[
 ['Объект и масштаб','Начнём с условий проекта. Неизвестные параметры можно уточнить позже.'],
 ['Какими источниками будем управлять?','Добавьте помещения и источники света. Для всего проекта выберем один основной метод управления.'],
 ['Как будет работать управление?','Выберите удобные способы управления и дополнительные возможности.'],
 ['Подходящие решения','Сравните варианты, прочитайте пояснения и выберите метод управления.'],
 ['Уточним параметры оборудования','Проверьте список источников и раскройте дополнительные параметры рядом с каждой позицией.'],
 ['Оборудование для вашего проекта','Сначала указан тип устройства, затем подходящие предложения Maytoni из матрицы.']
];
function render(){
 const active=document.activeElement;let selector=null;
 if(active?.dataset.choice)selector='[data-choice="'+active.dataset.choice+'"][data-value="'+active.dataset.value+'"]'+(active.dataset.source?'[data-source="'+active.dataset.source+'"]':'');
 else if(active?.dataset.field&&active?.dataset.source)selector='[data-field="'+active.dataset.field+'"][data-source="'+active.dataset.source+'"]';
 if(state.step>3&&(!state.selected||!state.confirmed))state.step=3;
 $('#steps').innerHTML=STEPS.map((t,i)=>'<button type="button" class="step '+(i<state.step?'done':'')+'" data-go="'+i+'" '+(i===state.step?'aria-current="step"':'')+' '+(i>3&&!state.confirmed?'disabled':'')+'><span aria-hidden="true">'+(i<state.step?'✓':i+1)+'</span><span>'+t+'</span></button>').join('');
 $('#eyebrow').textContent='Шаг '+(state.step+1)+' из '+STEPS.length;
 $('#title').textContent=META[state.step][0];$('#subtitle').textContent=META[state.step][1];
 $('#page').innerHTML=[objectPage,sourcesPage,controlsPage,resultPage,equipmentParametersPage,equipmentResultsPage][state.step]();
 $('#progressBar').style.width=((state.step+1)/STEPS.length*100)+'%';$('#back').disabled=state.step===0;
 const next=$('#next');next.disabled=false;
 next.innerHTML=state.step===5?'Выгрузить в Excel':state.step===4?'Подобрать оборудование':state.step===3?(result?.candidates.length?'К подбору оборудования':'Уточнить ответы'):state.step===2?'Подобрать метод':'Далее '+icon('arrow',16);
 if(selector)$(selector)?.focus({preventScroll:true});persist();
}
function revealInput(el){if(!el)return;for(let p=el.parentElement;p&&p.id!=='page';p=p.parentElement)if(p.tagName==='DETAILS')p.open=true;el.focus({preventScroll:true});el.scrollIntoView({block:'center',behavior:'auto'});}
function validPage(){
 const invalid=$('#page').querySelector('input:invalid');if(invalid){revealInput(invalid);invalid.reportValidity();return false;}
 if(state.step===4)for(const src of state.sources)if(src.type!=='led_external'&&numeric(src.vmin)!==null&&numeric(src.vmax)!==null&&Number(src.vmin)>Number(src.vmax)){showToast('Минимальное напряжение не может быть больше максимального.');revealInput($('[data-source="'+src.id+'"][data-field="vmax"]'));return false;}
 return true;
}
function go(step){
 if(!validPage())return;if(step>3&&!state.confirmed){showToast('Сначала выберите и подтвердите метод управления.');return;}
 state.step=Math.max(0,Math.min(5,step));render();window.scrollTo({top:0,behavior:'auto'});$('#title').focus({preventScroll:true});
}
function showToast(text,undo=false){clearTimeout(toastTimer);$('#toast').innerHTML=esc(text)+(undo?'<button type="button" data-action="undo-delete">Вернуть</button>':'');$('#toast').hidden=false;toastTimer=setTimeout(()=>{$('#toast').hidden=true;},undo?9000:4500);}
function resultText(){const r=result?.candidates.find(x=>x.id===state.selected);return r?'Maytoni\nВыбрано: '+r.title+'\nСоответствие: '+r.score+'%\n'+proto[r.id].description:'';}
function rememberDeletion(){lastDeleted={rooms:state.rooms.map(x=>({...x})),sources:state.sources.map(x=>({...x,features:[...x.features]})),activeRoom:state.activeRoom};}
function focusSource(src){requestAnimationFrame(()=>{const card=$('[data-card="'+src.id+'"]');if(card)card.scrollIntoView({block:'start',behavior:'smooth'});$('[data-source="'+src.id+'"][data-field="type"]')?.focus({preventScroll:true});});}
document.addEventListener('click',async e=>{
 const choice=e.target.closest('[data-choice]');
 if(choice){const key=choice.dataset.choice,v=choice.dataset.value,source=choice.dataset.source?state.sources.find(x=>x.id===choice.dataset.source):null,obj=source||state;
  if(!Object.hasOwn(obj,key))return;obj[key]=choice.dataset.multiple?toggle(obj[key],v):v;
  if(state.step<4)invalidate();else{equipmentReport=null;persist();}render();return;
 }
 const nav=e.target.closest('[data-go]');if(nav){if(!nav.disabled)go(Number(nav.dataset.go));return;}
 const button=e.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;
 if(action==='select-room'){if(!validPage())return;state.activeRoom=button.dataset.room;render();return;}
 if(action==='add-room'){
  if(!validPage())return;state.sources.forEach(x=>x.open=false);
  const id='r'+Date.now().toString(36)+(++sequence);let number=state.rooms.length+1;
  while(state.rooms.some(r=>r.name==='Помещение '+number))number++;
  state.rooms.push({id,name:'Помещение '+number});state.activeRoom=id;
  const src=newSource(id);state.sources.push(src);invalidate();render();
  $('#room-name')?.focus({preventScroll:true});$('#room-name')?.scrollIntoView({block:'center',behavior:'smooth'});return;
 }
 if(action==='delete-room'){
  if(state.rooms.length===1)return;rememberDeletion();const id=button.dataset.room;
  state.rooms=state.rooms.filter(x=>x.id!==id);state.sources=state.sources.filter(x=>x.roomId!==id);
  state.activeRoom=state.rooms[0].id;invalidate();render();showToast('Помещение и его источники удалены.',true);return;
 }
 if(action==='add-source'){
  if(!validPage())return;state.sources.forEach(x=>x.open=false);const src=newSource(state.activeRoom);
  state.sources.push(src);invalidate();render();focusSource(src);return;
 }
 if(action==='delete-source'){
  e.preventDefault();rememberDeletion();const src=state.sources.find(x=>x.id===button.dataset.id);if(!src)return;
  state.sources=state.sources.filter(x=>x.id!==src.id);
  if(!state.sources.some(x=>x.roomId===src.roomId))state.sources.push(newSource(src.roomId));
  invalidate();render();showToast('Источник удалён.',true);return;
 }
 if(action==='undo-delete'&&lastDeleted){state.rooms=lastDeleted.rooms;state.sources=lastDeleted.sources;state.activeRoom=lastDeleted.activeRoom;lastDeleted=null;invalidate();render();$('#toast').hidden=true;return;}
 if(action==='select-result'){state.selected=button.dataset.protocol;state.confirmed=false;equipmentReport=null;render();}
 if(action==='go-sources')go(1);if(action==='go-object')go(0);if(action==='go-method')go(3);
 if(action==='export-xlsx'){try{downloadEquipmentExcel();}catch(err){showToast('Не удалось сформировать Excel. Попробуйте снова.');console.error(err);}}
 if(action==='copy-result'){try{await navigator.clipboard.writeText(resultText());showToast('Итог скопирован.');}catch{showToast('Копирование недоступно. Используйте экспорт Excel после подбора.');}}
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset.roomName){const room=state.rooms.find(r=>r.id===el.dataset.roomName);if(room){room.name=el.value.slice(0,60);const title=$('[data-room-title="'+room.id+'"]');if(title)title.textContent=room.name||'Без названия';invalidate();}return;}
 if(!el.dataset.field||!el.dataset.source||el.tagName==='SELECT')return;const src=state.sources.find(x=>x.id===el.dataset.source);if(!src||!Object.hasOwn(src,el.dataset.field))return;src[el.dataset.field]=el.value;
 if(state.step<4)invalidate();else{equipmentReport=null;persist();}
 if(el.dataset.field==='name'){const title=$('[data-source-title="'+src.id+'"]');if(title)title.textContent=src.name||typeName(src);}
 const calculated=$('[data-load="'+src.id+'"]');if(calculated){const n=sourceLoad(src).value;calculated.innerHTML='Расчётная нагрузка: <strong>'+formatNumber(n)+(n!==null?' Вт':'')+'</strong>';}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.roomName){const room=state.rooms.find(r=>r.id===el.dataset.roomName);if(room){room.name=room.name.trim()||'Помещение '+(state.rooms.indexOf(room)+1);persist();}return;}
 if(el.tagName!=='SELECT'||el.dataset.field!=='type')return;const src=state.sources.find(x=>x.id===el.dataset.source);if(!src)return;
 src.type=el.value;src.features=src.features.filter(x=>validFeatures(src.type).includes(x));if(!src.features.length)src.features=['unknown'];
 for(const k of ['voltage','length','power','current','vmin','vmax','load','unitPower','units','chip'])src[k]='';
 src.phaseDim='unknown';src.rfCompatible='unknown';src.neutral='unknown';src.sync='unknown';src.open=true;invalidate();render();
});

document.addEventListener('toggle',e=>{const id=e.target.dataset?.card||e.target.dataset?.params;if(!id)return;const src=state.sources.find(x=>x.id===id);if(src){src[e.target.dataset.params?'paramsOpen':'open']=e.target.open;persist();}},true);
$('#back').addEventListener('click',()=>go(Math.max(0,state.step-1)));
$('#next').addEventListener('click',()=>{
 if(state.step===5){downloadEquipmentExcel();return;}if(state.step<3){go(state.step+1);return;}if(state.step===4){go(5);return;}
 if(!result?.candidates.length){go(result?.insufficient?1:0);return;}state.confirmed=true;go(4);
});
$('#reset').addEventListener('click',()=>{if(confirm('Начать заново и очистить текущие ответы?')){state=defaults();result=null;equipmentReport=null;lastDeleted=null;render();window.scrollTo({top:0,behavior:'auto'});}});
window.MaytoniControl=Object.freeze({version:'4.0',evaluate,defaults,normalize,buildEquipment,matchProduct,sourceLoad,createExcel,exportRows,projectConditions,spiMode,catalog:CATALOG});
render();

})();
</script>
</body>
</html>
